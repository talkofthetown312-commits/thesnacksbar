name: TalkOS Multi-Platform Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # 1. Web & PWA Build and Verification
  release-web:
    name: Build Web & PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit & ERP Integration Tests
        run: npm run test

      - name: Run TypeScript Verification
        run: npm run lint

      - name: Build Web & PWA Bundle
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}
          NODE_ENV: production

      - name: Archive Web & PWA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: talkos-web-pwa
          path: dist/

  # 2. Desktop Matrix Builds (Windows .exe, macOS .dmg, Linux .AppImage/.deb)
  release-desktop:
    name: Build Desktop (${{ matrix.os }})
    needs: [release-web]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_name: talkos-windows-exe
            package_flag: --win
          - os: macos-latest
            artifact_name: talkos-macos-dmg
            package_flag: --mac
          - os: ubuntu-latest
            artifact_name: talkos-linux-appimage-deb
            package_flag: --linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Electron Desktop Bundle
        run: npm run build:electron

      - name: Package Native Desktop Distributable
        run: npx --yes electron-builder ${{ matrix.package_flag }} --config electron-builder.yml --publish never

      - name: Archive Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/
            dist-electron/

  # 3. Android APK & AAB Release Pipeline (Auto-scaffolds android/ if missing)
  release-android:
    name: Build Android APK & AAB
    needs: [release-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Build Native Android Assets
        run: |
          npm ci
          npm run build:android

      - name: Assemble Android APK & AAB Packages
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Archive Android APK & AAB Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talkos-android-apk-aab
          if-no-files-found: ignore
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab

  # 4. iOS Capacitor Xcode Project Sync & Archive (Auto-scaffolds ios/ if missing)
  release-ios:
    name: Prepare iOS Xcode Project
    needs: [release-web]
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies & Sync Capacitor iOS Project
        run: |
          npm ci
          npm run build:ios

      - name: Archive iOS Xcode Project Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talkos-ios-xcode-project
          if-no-files-found: ignore
          path: |
            ios/
            capacitor.config.ts

