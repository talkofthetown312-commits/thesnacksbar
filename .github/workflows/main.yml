name: TalkOS Production Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Build Web Application
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.FIREBASE_DATABASE_ID || 'ai-studio-talkosarchitectu-438c4707-59bb-4b28-aa84-26b8ca15c574' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          NODE_ENV: production

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Android Build Notice
        run: |
          echo "TalkOS uses a Web POS stack (React/Vite). Mobile wrappers (Capacitor/React Native) or separate Flutter repositories will use this step."
          echo "Placeholder for APK/AAB generation."

  build-ios:
    runs-on: ubuntu-latest
    steps:
      - name: iOS Build Notice
        run: |
          echo "TalkOS uses a Web POS stack (React/Vite). iOS App Store builds via Capacitor require Xcode build steps here."
