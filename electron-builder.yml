appId: com.talkofthetown.pos
productName: TalkOS
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraMetadata:
  main: dist-electron/main.cjs
asar: true
win:
  icon: assets/icon.png
  target:
    - portable
    - nsis
  artifactName: TalkOS-Windows-${version}.${ext}
linux:
  icon: assets/icon.png
  category: Office
  target:
    - AppImage
    - deb
  artifactName: TalkOS-Linux-${version}.${ext}
mac:
  icon: assets/icon.png
  category: public.app-category.business
  target:
    - dmg
    - zip
  artifactName: TalkOS-macOS-${version}.${ext}
